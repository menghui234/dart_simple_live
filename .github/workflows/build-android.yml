 - name: Prepare temporary signing for Debug
        if: inputs.build_type == 'debug'
        run: |
          keytool -genkeypair \
            -keystore simple_live_app/android/app/ci-temp.jks \
            -storetype PKCS12 \
            -alias ci-temp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass android \
            -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US" \
            -noprompt

          printf 'storeFile=ci-temp.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=ci-temp\n' \
            > simple_live_app/android/key.properties

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Restore dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Configure release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing secret: $var"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > simple_live_app/android/app/keystore.jks

          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > simple_live_app/android/key.properties

          chmod 600 simple_live_app/android/app/keystore.jks
          chmod 600 simple_live_app/android/key.properties

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: simple_live_app
        run: flutter build apk --debug

      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-${{ inputs.build_type }}-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
