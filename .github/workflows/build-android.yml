
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK build type"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:

      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      # 4. Check Flutter environment
      - name: Check Flutter environment
        run: flutter doctor -v

      # 5. Install dependencies
      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      # 6. Prepare Debug signing
      - name: Prepare Debug signing
        if: inputs.build_type == 'debug'
        run: |
          set -e

          keytool -genkeypair \
            -keystore simple_live_app/android/app/ci-debug.jks \
            -storetype PKCS12 \
            -alias ci-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass android \
            -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US" \
            -noprompt

          printf 'keyAlias=ci-debug\nkeyPassword=android\nstoreFile=ci-debug.jks\nstorePassword=android\n' \
            > simple_live_app/android/key.properties

      # 7. Prepare Release signing
      - name: Prepare Release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing secret: $var"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > simple_live_app/android/app/keystore.jks

          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > simple_live_app/android/key.properties

          chmod 600 simple_live_app/android/key.properties
          chmod 600 simple_live_app/android/app/keystore.jks

      # 8. Build Debug APK
      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: simple_live_app
        run: flutter build apk --debug

      # 9. Build Release APK
      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-${{ inputs.build_type }}-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
